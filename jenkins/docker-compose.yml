services:
  jenkins:
    image: my-jenkins
    build: .
    container_name: jenkins
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - jenkins

    user: root

networks:
  jenkins:
    driver: bridge

volumes:
  jenkins-data:
