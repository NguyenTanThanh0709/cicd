version: "3.8"

services:
  postgres-db:
    image: postgres:15
    container_name: postgres-testingUA
    restart: always
    environment:
      POSTGRES_DB: testingUA
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: nguyentanthanh0709/testing-spring-boot-app:latest
    container_name: testing-spring-boot-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: stg
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/testingUA
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - postgres-db

volumes:
  postgres_data:
  jenkins_home:
